[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edupulse-ai"
version = "1.0.0"
description = "Education Welfare Command Center & Retention Efficacy Tracker"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "EduPulse AI Team" }]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
